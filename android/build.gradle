buildscript {
    repositories {
        google()
        mavenCentral() // Add this line if it's not present
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0' // Use the latest stable version
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0" // Use the latest stable version
        // NOTE: Do not place your application dependencies here; they belong in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
